name: Mutation testing

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker4s (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        module:
          - logic
          - journal
          - reasoner
          - core
          - lms
          - vocab

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache sbt dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Run mutation tests
        run: >-
          nix develop --command sbt -batch
          "${{ matrix.module }}/stryker
          --reporters console
          --reporters html
          --reporters json
          --thresholds.high 100
          --thresholds.low 100
          --thresholds.break 99"

      # Stryker4s requires `break` to be strictly below `low`, so 99 is the strictest threshold it
      # will accept. Every module is at 100%, so the report itself is the gate: any mutant left
      # alive or uncovered fails the build.
      - name: Require a 100% mutation score
        run: >-
          report="$(ls -1dt modules/${{ matrix.module }}/target/stryker4s-report/*/report.json | head -1)";
          alive="$(nix shell nixpkgs#jq --command jq -r
          '[.files[].mutants[] | select(.status == "Survived" or .status == "NoCoverage")] | length'
          "$report")";
          if [ "$alive" -eq 0 ]; then
            echo "all mutants killed";
          else
            nix shell nixpkgs#jq --command jq -r
            '.files[].mutants[]
             | select(.status == "Survived" or .status == "NoCoverage")
             | "\(.mutatorName) -> \(.replacement)"'
            "$report";
            exit 1;
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker4s-${{ matrix.module }}
          path: modules/${{ matrix.module }}/target/stryker4s-report
          if-no-files-found: warn
